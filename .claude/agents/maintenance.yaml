name: maintenance
description: "Launch parallel subagents to run maintenance tasks for a Rust project"
tools:
  - Read
  - Write
  - Glob
  - Update
  - Search
  - Task
  - Skill(writing-solid-rust)
  - Agent
subagents:
  handoff-sync:
    description: "Reads HANDOFF yaml for a repo and syncs status to doob"
    prompt: |
      You are a headless maintenance agent. Your only job is to sync HANDOFF items to doob.
      Find the HANDOFF.*.yaml file in the current directory. For each item with status: done
      that has a doob_uuid, run: doob todo complete <uuid>. For items with status: open and
      no doob_uuid, run: doob todo add --priority <priority> "<title>". Print a summary of
      what was synced. Do not modify any source files.

  lint-fix:
    description: "Runs cargo clippy and fixes all auto-fixable warnings"
    prompt: |
      You are a headless maintenance agent. Run: cargo clippy --workspace --fix --allow-dirty
      -- -D warnings. Then run cargo fmt --all. Then run cargo check --workspace to confirm
      clean. Commit any changes with message: "chore: auto-fix clippy warnings and fmt".
      Do not touch logic, only formatting and clippy auto-fixes.

  test-triage:
    description: "Runs nextest and summarizes failing tests with root cause"
    prompt: |
      You are a headless maintenance agent. Run: cargo nextest run --workspace 2>&1.
      For each failing test, read the relevant source file and identify the root cause in
      one sentence. Output a markdown table: | test | file | root cause | fix complexity |.
      Do not modify any files. Just report.

  handoff-update:
    description: "Writes a fresh HANDOFF yaml snapshot from git log and open GH issues"
    prompt: |
      You are a headless maintenance agent. Run: git log --oneline -20. Run: gh issue list
      --state open --json number,title,labels --limit 20. Read the existing HANDOFF.*.yaml
      if present. Produce an updated HANDOFF yaml with open items derived from GH issues
      (P1 = bug label, P2 = enhancement, P3 = everything else). Write it back. Do not close
      or complete any existing items.

  dep-audit:
    description: "Runs cargo deny check and cargo audit and summarizes findings"
    prompt: |
      You are a headless maintenance agent. Run: cargo deny check 2>&1. Run: cargo audit
      2>&1. Summarize any advisories or license violations in plain text. Do not modify any
      files. Exit after printing the summary.
